
name: 发布 React 项目镜像到 Aliyun Docker
run-name: 发布 React 项目镜像到 Aliyun Docker

on:
  push:
    tags: ["v*"]
    # branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  Aliyun_Docker_Login_Server: https://registry.cn-shanghai.aliyuncs.com
  Aliyun_Docker_Region_Id: cn-shanghai
  Aliyun_Docker_Username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
  Aliyun_Docker_Password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
  Aliyun_Docker_Image: registry.cn-shanghai.aliyuncs.com/houheaven-docker-hub/hh-cicd-web-react

jobs:
  docker:
    name: 构建并发布 Docker 镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Aliyun Docker
        if: github.ref_type == 'tag'
        uses: aliyun/acr-login@v2.0.3
        with:
          login-server: ${{ env.Aliyun_Docker_Login_Server }}
          region-id: ${{ env.Aliyun_Docker_Region_Id }}
          username: ${{ env.Aliyun_Docker_Username }}
          password: ${{ env.Aliyun_Docker_Password }}

      - name: 生成镜像标签和元数据
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.Aliyun_Docker_Image }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: 构建并推送镜像
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: ./web-react
          file: ./web-react/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # - name: 构建并推送镜像

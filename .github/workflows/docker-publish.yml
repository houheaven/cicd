
name: 发布 React 项目镜像到 Aliyun Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: 构建并发布 Docker 镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # - name: 配置 Docker Buildx
      #   uses: docker/setup-buildx-action@v4

      - name: 登录 Aliyun Docker
        if: github.event_name != 'pull_request'
        uses: aliyun/acr-login@v2.0.3
        with:
          login-server: ${{ secrets.ALIYUN_DOCKER_URL }}
          region-id: ${{ secrets.ALIYUN_DOCKER_REGION_ID }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
          # instance-id: ${{ secrets.ALIYUN_DOCKER_IMAGE }}

      # - name: 生成镜像标签和元数据
      #   id: metadata
      #   uses: docker/metadata-action@v6
      #   with:
      #     images: ${{ secrets.DOCKER_HUB_USERNAME }}/hh-cicd-web-react
      #     tags: |
      #       type=raw,value=latest,enable={{is_default_branch}}
      #       type=semver,pattern={{version}}

      - name: 构建并推送镜像
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
          --platform linux/amd64 \
          --tag ${{ env.IMAGE_TAG }} \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          --provenance=false \
          --push \
          --file ./web-react/docker/Dockerfile \
          ./web-react
        # with:
        #   context: ./web-react
        #   file: ./web-react/docker/Dockerfile
        #   # platforms: linux/amd64
        #   push: ${{ github.event_name != 'pull_request' }}
        #   tags: ${{ steps.metadata.outputs.tags }}
        #   labels: ${{ steps.metadata.outputs.labels }}
        #   cache-from: type=gha
        #   cache-to: type=gha,mode=max
        #   provenance: false

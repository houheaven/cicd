
name: 发布 React 项目镜像到 Aliyun Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: 构建并发布 Docker 镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Aliyun Docker
        # if: github.ref_type == 'tag'
        uses: aliyun/acr-login@v2.0.3
        with:
          login-server: ${{ secrets.ALIYUN_DOCKER_URL }}
          region-id: ${{ secrets.ALIYUN_DOCKER_REGION_ID }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: 构建并推送镜像
        # if: github.ref_type == 'tag'
        run: |
          docker buildx build \
          --platform linux/amd64 \
          --tag registry.cn-shanghai.aliyuncs.com/houheaven-docker-hub/hh-cicd-web-react:${{ github.ref_name || 'latest' }} \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          --provenance=false \
          --push \
          --file ./web-react/docker/Dockerfile \
          ./web-react
        # with:
        #   context: ./web-react
        #   file: ./web-react/docker/Dockerfile
        #   platforms: linux/amd64
        #   push: ${{ github.ref_type == 'tag' }}
        #   tags: registry.cn-shanghai.aliyuncs.com/houheaven-docker-hub/hh-cicd-web-react:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

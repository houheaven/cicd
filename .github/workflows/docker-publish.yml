
name: 发布 React 项目镜像到 Docker Hub

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docker:
    name: 构建并发布 Docker 镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: ./web-react
          push: true
          tags: houheaven/hh-cicd-web-react:latest

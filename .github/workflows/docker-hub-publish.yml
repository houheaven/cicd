
name: 发布 React 项目镜像到 Docker Hub
run-name: 发布 React 项目镜像到 Docker Hub

on:
  push:
    tags: ['v*']
    # branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  Docker_Hub_Username: ${{ secrets.DOCKER_HUB_USERNAME }}
  Docker_Hub_Password: ${{ secrets.DOCKER_HUB_TOKEN }}
  Docker_Hub_Image: ${{ secrets.DOCKER_HUB_USERNAME }}/hh-cicd-web-react
  # Docker_Tag: ${{ github.ref_name || 'latest' }}

jobs:
  docker:
    name: 构建并发布 Docker 镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ env.Docker_Hub_Username }}
          password: ${{ env.Docker_Hub_Password }}

      - name: 生成镜像标签和元数据
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.Docker_Hub_Image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: ./web-react
          file: ./web-react/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

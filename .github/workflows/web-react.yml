
name: React 项目工作流
on: push

jobs:
  build:
    name: 构建 React 项目
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web-react
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: 安装依赖、构建项目
        run: |
          npm ci
          npm run build
